services:
  - type: web
    name: sentry-on-call
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: AGENTPHONE_API_KEY
        sync: false
      - key: AGENTPHONE_AGENT_ID
        sync: false
      - key: ALERT_PHONE_NUMBERS
        sync: false
      - key: SENTRY_WEBHOOK_SECRET
        sync: false
      - key: SMS_COOLDOWN_MINUTES
        value: "15"
      - key: CALL_COOLDOWN_MINUTES
        value: "30"
